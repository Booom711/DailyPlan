name: Daily Fitness Push

on:
  schedule:
    # 每天 08:30 北京时间（UTC 00:30）
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout follow-builders feed scripts
        uses: actions/checkout@v4
        with:
          repository: zarazhangrui/follow-builders
          path: follow-builders

      - name: Prepare AI digest data
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.follow-builders"
          printf '{"language":"zh","frequency":"daily","delivery":{"method":"stdout"}}\n' > "$HOME/.follow-builders/config.json"
          node follow-builders/scripts/prepare-digest.js > raw-digest.json

      - name: Build AI digest
        continue-on-error: true
        run: python3 scripts/build_digest.py --input raw-digest.json --output ai_digest.md

      - name: Generate Chinese refined digest with DeepSeek
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python3 scripts/remix_chinese.py --input ai_digest.md --output ai_digest.md

      - name: Push today's plan to WeChat
        env:
          PUSH_PROVIDER: ${{ vars.PUSH_PROVIDER || 'auto' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python3 scripts/send_wechat.py --digest-file ai_digest.md
